[pytest]
# Pytest configuration for EcoStudio ML tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete workflows
    slow: Tests that take more than 1 second
    ml: Machine learning related tests
    features: Feature engineering tests
    training: Model training tests
    prediction: Prediction generation tests

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=app/ml --cov-report=html --cov-report=term

# Asyncio configuration
asyncio_mode = auto
